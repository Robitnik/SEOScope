services:
  api:
    build:
      context: .
      additional_contexts:
        # Not referenced by the Dockerfile (CI's plain `docker build .` has
        # no sibling checkout to hand it) — kept for a future pinned/baked
        # build. Local dev instead gets AISeoTools via the runtime bind
        # mount below, installed by docker/entrypoint.sh when present.
        # Override via compose.override.yaml if your checkout lives elsewhere.
        aiseotools: ${AISEOTOOLS_PATH:-../../seo/AISeoTools}
    image: yovth-clients-report:latest
    command: ["api"]
    env_file:
      # Provider secrets stay owned by AISeoTools and are injected only at
      # runtime. They are never copied into this repository or image.
      - ${AISEOTOOLS_PATH:-../../seo/AISeoTools}/.env
    environment:
      SEOTOOLS_ROOT: /seo/runtime
      # Browser session bridge (task-20): AISeoTools' warm Chrome exposes CDP on the HOST's
      # 127.0.0.1 only (chrome.py — out of this task's owned paths, not changed) — no bridge or
      # bind-address widening can reach a loopback-only socket from a separate network namespace.
      # `network_mode: host` below is what actually makes 127.0.0.1:<port> resolve to the host's
      # loopback from inside this container; SEOTOOLS_REMOTE_CDP_HOST only needs to tell AISeoTools'
      # warm.py to stop trusting `_pid_alive` (a HOST pid, meaningless in this container's own PID
      # namespace) and rely on `_cdp_alive` alone.
      CHROME_CDP_HOST: ${CHROME_CDP_HOST:-127.0.0.1}
      SEOTOOLS_REMOTE_CDP_HOST: ${CHROME_CDP_HOST:-127.0.0.1}
      # With `network_mode: host`, `ports:`/host-port-publishing no longer apply — uvicorn's bind
      # port IS the host's port directly. API_PORT (read by docker/entrypoint.sh) restores the
      # project's usual local port instead of defaulting to uvicorn's bare 8000; a clash with
      # another host listener on this port is the operator's to resolve, not compose's.
      API_PORT: ${API_PORT:-6524}
      # Shared DOWNLOAD directory (2026-07-23). The warm Chrome runs on the HOST, this worker in a
      # container: `page.expect_download()`/`save_as()` cannot cross that filesystem boundary and
      # silently yields 0-byte files (the real bytes land in the host's own download dir). AISeoTools
      # instead points the remote Chrome's downloads at THIS dir via CDP `Browser.setDownloadBehavior`
      # and reads the finished file back off the shared mount below. Same absolute path on both sides
      # (host substitution of ${HOME}) so the one string is valid for Chrome AND the reader.
      SEO_BROWSER_DOWNLOAD_DIR: ${HOME}/.local/share/seo-audit/downloads
    # Host networking (Linux-only; this project targets Linux dev/deploy) is the price of the CDP
    # bridge above: api and worker now also share the host's other listening ports.
    network_mode: host
    volumes:
      # Dev-only live-edit mount: host source overlays the image's baked-in
      # copy. Dependencies live in system site-packages (Dockerfile sets
      # POETRY_VIRTUALENVS_CREATE=false), never under /app, so this bind
      # mount can never shadow them.
      - .:/app
      # Local AISeoTools checkout (task-08+ providers import `seo_audit`).
      # Not baked into the image (would leak `.env`/browser-profile state
      # into a distributable layer) — entrypoint.sh installs it from here
      # at container start, iff this path exists. Absent on CI/deploy,
      # where these providers are exercised only via live smoke (PLAN §15).
      - ${AISEOTOOLS_PATH:-../../seo/AISeoTools}:/seo/AISeoTools
      # Warm-session DISCOVERY ONLY, read-only, and deliberately NOT the whole runtime dir.
      #
      # This used to be `${HOME}/.local/share/seo-audit:/seo/runtime` — the operator's entire
      # runtime, writable, into a container that runs as root. On 2026-07-22 that is exactly what
      # destroyed their logins: this container launched Chrome inside the mounted profile and left
      # root-owned `Local State` / `Preferences` (mode 0600) behind, which the operator could not
      # even read afterwards. Every Google account appeared logged out, recoverable only by
      # re-logging in by hand.
      #
      # This container is a pure CONSUMER: it attaches over CDP (see network_mode + the CDP env
      # vars above) to a Chrome the HUMAN started with `seo-audit browser-up` on the host. All it
      # needs from the host is `state/<provider>_chrome.json` to learn the CDP port — nothing
      # else, and nothing writable. With `profiles/` simply absent it cannot corrupt a profile
      # even if the attach-only env var is ever lost.
      - ${HOME}/.local/share/seo-audit/state:/seo/runtime/state:ro
      # The ONE writable exception, nested inside the read-only mount above: zero-byte flock
      # files. `flock` needs O_RDWR, so a lock we cannot open is a lock we cannot share — and an
      # unshared lock means this service and a host CLI run would drive the same warm Chrome at
      # once, clicking in each other's tabs. Nothing but locks lives here; the profile, the
      # activity counters and every artifact stay out of this container's reach.
      - ${HOME}/.local/share/seo-audit/state/locks:/seo/runtime/state/locks
      # Shared download drop (see SEO_BROWSER_DOWNLOAD_DIR above): the host Chrome WRITES exports
      # here, this container READS them back. Mounted at the SAME absolute path both sides so one
      # string works for Chrome and the reader. Disposable scratch — never the profile, so root
      # touching it cannot corrupt a login (unlike the 2026-07-22 profile-mount incident).
      - ${HOME}/.local/share/seo-audit/downloads:${HOME}/.local/share/seo-audit/downloads
      - app_data:/app/app_data
      - artifacts:/app/app_data/artifacts
      - browser_profiles:/app/app_data/browser_profiles
    healthcheck:
      # CMD-SHELL (not exec-form CMD) so the container's own API_PORT env var is substituted at
      # check time — this must track the port entrypoint.sh actually binds (see comment above).
      test: ["CMD-SHELL", "curl -f http://localhost:${API_PORT:-6524}/healthz"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 30s
      # Without this, the first probe after a failed one waits a full `interval`,
      # so a container that is serving at t=11s is only reported healthy at t=15s
      # — ~4s of `compose up --wait` spent purely waiting for the next tick.
      # During `start_period` we poll every second instead; failures there still
      # don't count against `retries`.
      start_interval: 1s
    restart: unless-stopped

  worker:
    image: yovth-clients-report:latest
    command: ["worker"]
    env_file:
      - ${AISEOTOOLS_PATH:-../../seo/AISeoTools}/.env
    environment:
      SEOTOOLS_ROOT: /seo/runtime
      CHROME_CDP_HOST: ${CHROME_CDP_HOST:-127.0.0.1}
      SEOTOOLS_REMOTE_CDP_HOST: ${CHROME_CDP_HOST:-127.0.0.1}
      # Shared DOWNLOAD directory — see the api service for the full rationale. The worker is the
      # service that actually runs collections, so this is the one that needs it most.
      SEO_BROWSER_DOWNLOAD_DIR: ${HOME}/.local/share/seo-audit/downloads
    network_mode: host
    volumes:
      - .:/app
      - ${AISEOTOOLS_PATH:-../../seo/AISeoTools}:/seo/AISeoTools
      # Read-only warm-session discovery, never the profiles — see the api service above.
      - ${HOME}/.local/share/seo-audit/state:/seo/runtime/state:ro
      # The ONE writable exception, nested inside the read-only mount above: zero-byte flock
      # files. `flock` needs O_RDWR, so a lock we cannot open is a lock we cannot share — and an
      # unshared lock means this service and a host CLI run would drive the same warm Chrome at
      # once, clicking in each other's tabs. Nothing but locks lives here; the profile, the
      # activity counters and every artifact stay out of this container's reach.
      - ${HOME}/.local/share/seo-audit/state/locks:/seo/runtime/state/locks
      # Shared download drop — see the api service above.
      - ${HOME}/.local/share/seo-audit/downloads:${HOME}/.local/share/seo-audit/downloads
      - app_data:/app/app_data
      - artifacts:/app/app_data/artifacts
      - browser_profiles:/app/app_data/browser_profiles
    shm_size: "1gb"
    healthcheck:
      test: ["CMD-SHELL", "pgrep -f 'app.jobs.worker|worker_placeholder.py' || exit 1"]
      interval: 15s
      timeout: 3s
      retries: 5
      start_period: 30s
      start_interval: 1s
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy

volumes:
  app_data:
  artifacts:
  browser_profiles:
