<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex, nofollow">
    <meta name="theme-color" content="#0e0e0e">
    <title>Sign in — Client Pulse</title>
    <link rel="icon" href="/assets/brand/logo.svg" type="image/svg+xml">
    <link rel="preload" href="/assets/fonts/league-spartan-black.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="stylesheet" href="/css/tokens.css?v=20260906-t71">
    <link rel="stylesheet" href="/css/login.css?v=20260906-t71">
    <script type="module" src="/js/login.js?v=20260906-t71"></script>
  </head>
  <body class="login-body">
    <main class="login-shell">
      <div class="login-brand" aria-hidden="true"></div>

      <section class="login-panel" aria-labelledby="login-title">
        <img class="login-logo" src="/assets/brand/logo.svg" width="205" height="42" alt="The Yovth">
        <p class="login-eyebrow">Client Pulse</p>
        <h1 class="login-title" id="login-title">Sign in</h1>
        <p class="login-lead">Internal SEO control room. Accounts are issued by an administrator.</p>

        <form class="login-form" id="login-form" novalidate>
          <div class="login-field">
            <label for="login-email">Work email</label>
            <input
              type="email" id="login-email" name="email" autocomplete="username"
              inputmode="email" required autofocus translate="no" spellcheck="false">
          </div>

          <div class="login-field">
            <label for="login-password">Password</label>
            <input
              type="password" id="login-password" name="password"
              autocomplete="current-password" required translate="no">
          </div>

          <p class="login-error" id="login-error" role="alert" aria-live="polite" hidden></p>

          <button class="login-submit" id="login-submit" type="submit">
            <span id="login-submit-label">Sign in</span>
          </button>
        </form>

        <p class="login-footnote">
          Lost your password? An administrator can issue a new one — passwords are
          generated by the system and cannot be reset from this screen.
        </p>
      </section>
    </main>
  </body>
</html>
