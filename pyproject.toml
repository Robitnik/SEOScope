[tool.poetry]
name = "yovth-clients-report"
version = "0.1.0"
description = "Внутрішній dashboard агенції для SEO/marketing-метрик (Ahrefs, Semrush, GSC, Reporting Ninja/GA4)"
authors = ["The Yovth"]
readme = "README.md"
package-mode = true
packages = [{ include = "app" }]

[tool.poetry.dependencies]
python = ">=3.11,<4.0"
# Bumped from ^0.115.0 by task-74 (MCP server): the `mcp` SDK below requires
# starlette>=0.48 on python>=3.14, and pyproject targets python>=3.11,<4.0 —
# the resolver has to satisfy 3.14 too, so fastapi^0.115 (which caps
# starlette<0.47) can't coexist with it. On our actual runtime (3.12)
# starlette stayed at 0.46.2 — no major-version jump in the running image,
# only in what the dependency graph has to prove is resolvable. Fixed a
# latent bug this bump exposed: FastAPI 0.141's `include_router()` no
# longer flattens routes into `app.routes` (see `tests/harness/routes.py`).
fastapi = "^0.141.1"
uvicorn = { extras = ["standard"], version = "^0.32.0" }
pydantic-settings = "^2.6.0"
sqlalchemy = "^2.0.0"
alembic = "^1.13.0"
aiosqlite = "^0.20.0"
# Added by task-75 (Postgres migration): driver for both the sync engine
# (worker/CLI/migrations) and the async engine (FastAPI) — SQLAlchemy 2.0's
# default async dialect for Postgres. `binary` extra bundles prebuilt wheels
# so the image needs no libpq-dev/gcc at build time; verified live against
# PostgreSQL 16 (task-75 §0: schema + all 1.24M rows migrated with zero
# code changes; task-75 §7.5: production cut over 2026-09-06, DATABASE_URL
# is Postgres). `aiosqlite` deliberately stays, revised from the original
# plan (task-75 §12 DoD #1 assumed it would go) — it turned out to still be
# a live dependency of ~10 OTHER tasks' unit-test fixtures across
# tests/unit/{api,reports,auth,audit,core}/ that build a private, isolated
# `sqlite+aiosqlite` file per test on purpose, unrelated to which engine
# production runs on; removing it would break every one of those files for
# no production benefit and would reach outside this task's owned paths to
# "fix" (task-01 owns pyproject.toml; requested directly by the user,
# flagged per CLAUDE.md's "нова залежність" escape hatch, same as
# openpyxl/b2sdk below).
psycopg = { extras = ["binary"], version = "^3.2" }
# Added by task-07 (importer): reads the AISeoTools `client_report_*.xlsx`
# "Historical Data" sheet. Was previously present only transitively via the
# optional `local` group, which the production Dockerfile never installs —
# promoted to a direct dependency, flagged per CLAUDE.md's "нова залежність"
# escape hatch (task-01 owns pyproject.toml; see this task's Completion
# report, "Контрактні зміни").
openpyxl = "^3.1"
# Added by task-52 (cloud storage / Backblaze B2): official B2 SDK for the
# nightly DB backup, the report mirror and the web-archive offload. Native B2
# API rather than boto3/S3-compat — the account's application keys are native
# B2 keys, and the SDK brings large-file upload, sha1 verification and
# server-side lifecycle rules with only `logfury` as an extra transitive dep
# (task-01 owns pyproject.toml; requested directly by the user, flagged per
# CLAUDE.md's "нова залежність" escape hatch).
b2sdk = "^2.8"
# Added by task-74 (MCP server): the official Python MCP SDK
# (`from mcp.server import MCPServer`, `@mcp.tool()`) — the earlier plan
# draft wrongly assumed `poetry lock` didn't work in this environment and
# proposed hand-rolling the protocol; it does work, so we don't (task-01
# owns pyproject.toml; requested directly by the user, flagged per
# CLAUDE.md's "нова залежність" escape hatch, same as openpyxl/b2sdk above).
mcp = "^2.1.1"

[tool.poetry.scripts]
# Added by task-07 (importer), as flagged in the task plan itself
# ("+ реєстрація в pyproject scripts — запит до task-01").
yovth-report = "app.cli:main"

[tool.poetry.group.dev.dependencies]
ruff = "^0.7.0"
mypy = "^1.13.0"
pytest = "^8.3.0"
pytest-asyncio = "^0.24.0"
httpx = "^0.27.0"

# Not installed at image build time (CI/deploy don't have this sibling
# checkout). Local dev: docker/entrypoint.sh runs `poetry install --with
# local` automatically at container start when the AISeoTools bind mount
# (compose.yaml) is present. For CI/deploy, task-01 should eventually pin
# AISeoTools to a commit/tag (git dependency) instead of this local path —
# see PLAN.md §8/§14 and doc/dev/done/task-08-aiseotools-core.md.
[tool.poetry.group.local]
optional = true

[tool.poetry.group.local.dependencies]
seo-audit = { path = "../../seo/AISeoTools", develop = true }

[build-system]
requires = ["poetry-core>=2.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_ignores = true
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
